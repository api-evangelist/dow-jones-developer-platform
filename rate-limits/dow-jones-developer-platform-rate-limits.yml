specification: API Commons Rate Limits
specificationVersion: '0.1'
provider: Dow Jones Developer Platform
providerId: dow-jones-developer-platform
generated: '2026-09-07'
method: searched
source: https://developer.dowjones.com/documents/site-docs-newswires_apis-certification_process (HTTP
  200)
created: '2026-05-04'
modified: '2026-09-07'
note: REPLACES a 2026-05-04 bulk-sweep scaffold that asserted free/professional/enterprise tiers with
  invented per-minute and per-month numbers. Dow Jones publishes none of that. What it does publish are
  call-frequency ceilings inside the Newswires certification rules, reproduced verbatim below. No rate-limit
  response headers are documented and none appear in any of the nine harvested OpenAPI documents, so a
  client cannot read its remaining budget at runtime and must schedule against the published frequency
  instead.
headers:
  documented: false
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
responseCodes:
  throttled: null
  note: No status code for exhaustion is documented. 503 Service Unavailable is declared across the specs
    for general unavailability.
limit_count: 3
limits:
- name: Newswires Real-Time API call frequency
  scope: application
  metric: seconds_between_calls
  limit: 1
  timeFrame: 15 seconds
  applies:
  - Dow Jones Newswires Real-Time API
  statement: Real-Time Newswire APIs can be called at most once every 15 seconds.
  source: https://developer.dowjones.com/documents/site-docs-newswires_apis-certification_process
- name: Top Stories collection list polling
  scope: application
  metric: seconds_between_calls
  limit: 1
  timeFrame: 15 minutes
  applies:
  - Newswires Top Stories API — GET /content-collections
  statement: This transaction should be called no more than once every 15 minutes.
  source: https://developer.dowjones.com/documents/site-docs-newswires_apis-certification_process
- name: Individual collection refresh
  scope: application
  metric: seconds_between_calls
  limit: 1
  timeFrame: 15 minutes
  applies:
  - Newswires Top Stories API — GET /content-collections/{ref}
  statement: You cannot update individual collections more than once every 15 minutes.
  source: https://developer.dowjones.com/documents/site-docs-newswires_apis-certification_process
policies:
- name: Human-initiated transactions
  description: Most transactions within the Newswires APIs require initiation through human intervention;
    GET /content-collections in the Top Stories API is the named exception and may be called on a schedule.
- name: Prefer a feed for volume
  description: Dow Jones directs customers needing higher rates to a feed product rather than to API polling.
- name: Certification
  description: Applications are checked against system logs during technical certification to confirm
    they perform within the certification metric limits before production release.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com

    content_text_base:
      type: object
      properties:
        text:
          type: string
    '404':
      description: Newsletter Not Found
    content_item:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          example: content
        links:
          $ref: '#/components/schemas/links'
        meta:
          $ref: '#/components/schemas/content_item_meta'
        attributes:
          $ref: '#/components/schemas/content_item_attribute'
    subsection:
      type: object
      description: Section
      properties:
        name:
          type: string
          description: Name
        position:
          type: integer
          format: int32
          description: Position
        items:
          type: array
          items:
            type: object
            anyOf:
            - $ref: '#/components/schemas/article_details'
            - $ref: '#/components/schemas/link_details'
            - $ref: '#/components/schemas/rss_details'
            - $ref: '#/components/schemas/chart_details'
          description: Items
        images:
          type: array
          items:
            $ref: '#/components/schemas/image'
          description: Elements

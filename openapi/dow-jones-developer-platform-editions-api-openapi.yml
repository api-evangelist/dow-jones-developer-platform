          description: Item Type
          example: Link
        title:
          type: string
          description: Title
        description:
          type: string
          description: Description
        flag:
          type: string
          enum:
          - Unspecified
          - Hot
          - MustRead
          - New
          description: Flag
        comments:
          type: string
          description: Comments
        url:
          type: string
          description: URL
        source_name:
          type: string
          description: Source Name
        author:
          type: string
          description: Author
        publication_date:
          type: string
          description: Publication Date
          example: '1997-07-16'
        language:
          type: string
          description: Language
          example: en
        body:
          type: string
          description: Body
        position:
          type: integer
          format: int32
          description: Position
          example: 1
        type:
          type: string
          enum:
          - Url
          - DocUrl
          - RssHeadlineUrl
    newsletter_list_meta:
      type: object
      properties:
        count:
          description: Count
          type: integer
          format: int32
        total_count:
          description: Total Count
          type: integer
          format: int32
        total_pages:
          description: Total Pages Count
          type: integer
          format: int32
        paging:
          type: object
          properties:
            offset:
              type: object
              properties:
                first:
                  type: integer
                  format: int32
                prev:
                  type: integer
                  format: int32
                next:
                  type: integer
                  format: int32
                last:
                  type: integer
                  format: int32
                current:
                  type: integer
                  format: int32
    edition_relationships:
      type: object
      properties:
        content:
          type: object
          properties:
            links:
              type: object
              properties:
                related:
                  type: string
            data:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    example: content
                  id:
                    type: string
    self_editions_link:
      type: object
      properties:
        self:
          type: string
          description: link to this single resourceType (self)
          example: https://localhost:8080/assets/newsletters/9876/editions/1234
    content_item_meta:
      type: object
      properties:
        alternate_document_id:
          type: string
        alternate_document_ref:
          type: string
        count:
          type: number
        context:
          type: string
        code_sets:
          $ref: '#/components/schemas/content_item_meta_code_sets'
        edition:
          type: object
          properties:
            name:
              type: string
            print:
              type: object
              properties:
                value:
                  type: string
                page:
                  type: string
                headlline:
                  type: string
                section:
                  type: string
                date:
                  type: string
        emphasis:
          type: object
          properties:
            hot:
              type: boolean
            dominant:
              type: boolean
            analysis:
              type: boolean
        geo_relevance:
          type: array
          items:
            type: object
            properties:
              latitude:
                type: number
              longitude:
                type: number
        is_translation_allowed:
          type: boolean
        keywords:
          type: array
          items:
            type: string
        language:
          type: object
          properties:
            code:
              type: string
              example: en
            descriptor:
              type: string
        metrics:
          type: object
          properties:
            character_count:
              type: number
              example: 1024
            word_count:
              type: number
              example: 256
            image_count:
              type: number
              example: 4
            chart_count:
              type: number
              example: 2
        original_doc_id:
          type: string
        source:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
            logo:
              type: object
              properties:
                alternate_text:
                  type: string
                alt_images:
                  $ref: '#/components/schemas/content_alt_images'
                caption:
                  $ref: '#/components/schemas/content_text_base'
                credit:
                  type: string
                media_type:
                  type: string
                name:
                  type: string
                uri:
                  type: string
                slug:
                  type: string
                width:
                  type: number
                height:
                  type: number
                type:
                  type: string
        bill_data:
          type: string
    error_response:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/error'
  securitySchemes:

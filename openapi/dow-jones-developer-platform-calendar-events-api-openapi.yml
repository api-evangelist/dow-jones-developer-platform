openapi: 3.2.0
info:
  title: Calendar Live Calendar Events API
  description: Calendar Live API
  version: 1.1.9
servers:
- url: https://api.dowjones.com/
tags:
- name: Calendar Events
paths:
  /calendar-events/{id}:
    get:
      tags:
      - Calendar Events
      summary: Searches for a single event by its unique identifier
      parameters:
      - name: id
        in: path
        description: Number that uniquely identifies the event.
        required: true
        schema:
          type: integer
      - name: filter[event_language]
        in: query
        description: Translate descriptions to this language if translation is available, otherwise show English version
        schema:
          type: string
      - name: options[show_ecoinfo]
        in: query
        description: Include ecoinfo as part of the event result.
        schema:
          type: boolean
          enum:
          - true
          - false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsModel'
        '400':
          description: 'Bad Request: Incorrect Parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized Access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: 'Not Found: No resource found for the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: 'Internal Server Error: Server encountered an unexpected condition.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: 'Service Unavailable: Server is currently unable to handle the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - bearerAuth: []
      operationId: getCalendarEventsById
      x-operation-id-source: derived
  /calendar-events/search:
    get:
      tags:
      - Calendar Events
      summary: Searches for specific events based on the given filter
      parameters:
      - name: filter[has_key_events_only]
        in: query
        description: Include only macroeconomic events that Dow Jones editors have classified as having a market impact. This categorization is based on news judgement and is updated on news merit.
        schema:
          type: boolean
          enum:
          - true
          - false
      - name: filter[has_confirmed_events_only]
        in: query
        description: Include only events whose date and time have been confirmed.
        schema:
          type: boolean
          enum:
          - true
          - false
      - name: filter[time_specified]
        in: query
        description: Filter events based on time specified
        schema:
          type: boolean
          enum:
          - true
          - false
      - name: filter[country]
        in: query
        description: ORed list of countries associated with the event (e.g. BH-Bahrain, AZ-Azerbaijan). These are countries related to the entity that provides data or sponsorship for the event. Use ISO codes and separate them with new lines when providing multiple codes.
        style: form
        explode: true
        schema:
          type: array
          items:
            minLength: 2
            type: string
      - name: filter[region]
        in: query
        description: ORed list of regions associated with the event (e.g. EMEM, EU, G10). These are regions related to the entity that provides data or sponsorship for the event. Use new lines when providing multiple region codes.
        style: form
        explode: true
        schema:
          type: array
          items:
            minLength: 2
            type: string
      - name: filter[event_code]
        in: query
        description: 'Event type: ICC-Corporate events, IEP-Economic and Political events, IDC-Treasury Auctions.'
        style: form
        explode: true
        schema:
          type: array
          items:
            minLength: 0
            type: string
            enum:
            - ICC
            - IEP
            - IDC
      - name: filter[series_code]
        in: query
        description: ORed list of event series codes (e.g. TrdBal-Trade Balance, ImptPx-Import Prices). Series codes enable searching for historical and upcoming repeatable events. Use new lines when providing multiple series codes.
        style: form
        explode: true
        schema:
          type: array
          items:
            minLength: 2
            type: string
      - name: filter[event_class]
        in: query
        description: Single classification of the event (e.g. IEP_STAT-Statistics and Economic Indicators, ICC_ANL-Earnings/Analysts Calls and GMs).
        style: form
        explode: true
        schema:
          type: array
          items:
            minLength: 0
            type: string
            enum:
            - ICC_ANAL
            - ICC_ANL
            - ICC_BRO
            - ICC_DIV
            - ICC_EARN
            - ICC_EXC
            - ICC_IND
            - ICC_IPO
            - ICC_OTH
            - ICC_SPLT
            - IEP_CAN
            - IEP_CONF
            - IEP_DEBT
            - IEP_EVT
            - IEP_HOL
            - IEP_IND
            - IEP_POL
            - IEP_STAT
            - IEP_US
            - IDC_ACT
            - IDC_ISS
      - name: filter[start_date]
        in: query
        description: Earliest date and time of interest, yyyy-MM-dd'T'HH:mm:ss'Z'.
        schema:
          type: string
          format: date-time
      - name: filter[end_date]
        in: query
        description: Latest date and time of interest, yyyy-MM-dd'T'HH:mm:ss'Z'.
        schema:
          type: string
          format: date-time
      - name: filter[ticker]
        in: query
        description: ORed list of Newswires codes. Use new lines when providing multiple ticker codes.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: filter[isin]
        in: query
        description: ORed list of ISINs. Use new lines when providing multiple isin codes.
        style: form
        explode: true
        schema:
          type: array
          items:
            minLength: 2
            type: string
      - name: filter[event_language]
        in: query
        description: Translate descriptions to this language if translation is available; otherwise, show English version.
        style: form
        explode: true
        schema:
          maxItems: 1
          minItems: 0
          type: array
          items:
            minLength: 0
            type: string
            enum:
            - ''
            - zh
            - ar
            - it
            - de
            - jp
      - name: options[show_ecoinfo]
        in: query
        description: Include ecoinfo as part of the events results.
        schema:
          type: boolean
          enum:
          - true
          - false
      - name: page[limit]
        in: query
        description: Maximum number of results for a single request, max size 1000.
        schema:
          type: integer
      - name: page[offset]
        in: query
        description: Paging offset, the event ID given serves as a reference point to request additional events (beyond what was returned according to the limit value). The response does not include the reference ID. To page backward to get older events, make the event number negative.
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsModel'
        '400':
          description: 'Bad Request: Incorrect Parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized Access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: 'Not Found: No resource found for the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: 'Internal Server Error: Server encountered an unexpected condition.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: 'Service Unavailable: Server is currently unable to handle the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - bearerAuth: []
      operationId: getCalendarEventsSearch
      x-operation-id-source: derived
    post:
      tags:
      - Calendar Events
      summary: Searches for specific events based on the given filters
      requestBody:
        description: Criteria
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postParams'
        required: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsModel'
        '400':
          description: 'Bad Request: Incorrect Parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized Access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: 'Not Found: No resource found for the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: 'Internal Server Error: Server encountered an unexpected condition.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: 'Service Unavailable: Server is currently unable to handle the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - bearerAuth: []
      x-codegen-request-body-name: Criteria
      operationId: postCalendarEventsSearch
      x-operation-id-source: derived
  /calendar-events/:
    get:
      tags:
      - Calendar Events
      summary: Searches for requested events with options for updated events
      parameters:
      - name: filter[id]
        in: query
        description: ORed list of event IDs. Separate each event ID with a comma when providing multiple events.
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
      - name: filter[last_updated_time]
        in: query
        description: Search only for events that have been updated since this date and time, (yyyy-MM-dd'T'HH:mm:ss'Z').
        schema:
          type: string
          format: date-time
      - name: filter[has_updates]
        in: query
        description: Search only for events that have been updated.
        schema:
          type: boolean
      - name: filter[event_language]
        in: query
        description: Translate descriptions to this language if translation is available; otherwise, show English version.
        schema:
          type: string
      - name: options[show_ecoinfo]
        in: query
        description: Include ecoinfo as part of the events results.
        schema:
          type: boolean
          enum:
          - true
          - false
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsModel'
        '400':
          description: 'Bad Request: Incorrect Parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized Access.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '404':
          description: 'Not Found: No resource found for the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: 'Internal Server Error: Server encountered an unexpected condition.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '503':
          description: 'Service Unavailable: Server is currently unable to handle the request.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      security:
      - bearerAuth: []
      operationId: getCalendarEvents
      x-operation-id-source: derived
    post:
      tags:
      - Calendar Events
      summary: Searches for requested events with options for updated events
      requestBody:
        description: Criteria
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/eventsPostParams'
        required: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/eventsModel'
        '400':
          description: 'Bad Request: Incorrect Parameters.'
          content:
            application/json:
              schema:

        confirmed_match:
          type: integer
          description: ''
          format: int32
        under_investigation:
          type: integer
          description: ''
          format: int32
        cleared_with_updates:
          type: integer
          description: ''
          format: int32
        cleared_without_updates:
          type: integer
          description: ''
          format: int32
      additionalProperties: false
      description: ''
    ResponseThirdPartyScreeningEntity:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ResponseDataThirdPartyScreeningEntity'
      additionalProperties: false
      description: ''
    ResponseDataThirdPartyScreeningEntity:
      type: object
      properties:
        id:
          type: string
          description: ''
        attributes:
          $ref: '#/components/schemas/ThirdPartyScreeningEntity'
        type:
          type: string
          description: ''
      additionalProperties: false
      description: ''
    PagingMeta:
      type: object
      properties:
        context:
          type: string
          description: ''
      additionalProperties: false
      description: ''
    RequestThirdPartyScreeningCreate:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RequestDataThirdPartyScreeningCreate'
      additionalProperties: false
      description: ''
    ScreeningIdentificationDetails:
      type: object
      properties:
        type:
          type: integer
          description: ''
          format: int32
        value:
          type:
          - string
          - 'null'
          description: ''
      additionalProperties: false
      description: ''
  securitySchemes:
    oauth2:
      type: apiKey
      description: 'Standard Authorization header using the Bearer scheme. Example: "bearer {token}"'
      name: Authorization
      in: header

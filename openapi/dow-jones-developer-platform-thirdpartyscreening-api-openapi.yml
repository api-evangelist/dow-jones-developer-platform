      description: ''
    RequestDataThirdPartyScreeningCreate:
      required:
      - attributes
      type: object
      properties:
        attributes:
          $ref: '#/components/schemas/ThirdPartyScreeningEntityCreate'
        type:
          type:
          - string
          - 'null'
          description: ''
      additionalProperties: false
      description: ''
    ErrorModelV2:
      type: object
      properties:
        status:
          type: integer
          description: ''
          format: int32
        code:
          type: integer
          description: ''
          format: int32
        title:
          type:
          - string
          - 'null'
          description: ''
        detail:
          type:
          - string
          - 'null'
          description: ''
      additionalProperties: false
      description: Updated Error model
    ThirdPartyScreeningEntityCreate:
      type: object
      properties:
        name:
          type: string
          description: ''
        country:
          type:
          - string
          - 'null'
          description: ''
        record_type:
          type: string
          description: ''
        monitored_entity_type_id:
          type: string
          description: ''
        identification_details:
          $ref: '#/components/schemas/ScreeningIdentificationDetails'
        year_of_birth:
          type:
          - integer
          - 'null'
          description: ''
          format: int32
      additionalProperties: false
      description: ''
    ErrorResponseModelV2:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorModelV2'
          description: ''

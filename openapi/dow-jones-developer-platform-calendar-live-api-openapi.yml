                value:
                  type: number
            proposed_price:
              type: object
              properties:
                currency:
                  type: string
                value:
                  type: number
            initial_price:
              type: object
              properties:
                currency:
                  type: string
                value:
                  type: number
            total_offer_size:
              type: object

components:
  schemas:
    eventsModel:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/eventDataModel'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            offset:
              type: object
              properties:
                prev:
                  type: integer
                next:
                  type: integer
            attribution:
              type: string
    ipoEventsModel:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/ipoEventDataModel'
        meta:
          type: object
          properties:
            count:
              type: integer
            total_count:
              type: integer
            offset:
              type: object
              properties:
                prev:
                  type: integer
                next:
                  type: integer
            attribution:
              type: string
    eventDataModel:
      type: object
      properties:
        type:
          type: string
        id:
          type: integer
          description: Number that uniquely identifies an event.
        attributes:
          type: object
          properties:
            is_confirmed:
              type: boolean
              description: Whether the event has been confirmed for this date and time
            is_key_event:
              type: boolean
              description: Whether a macroeconomic event has been identified by the Dow Jones News team as having a market impact, based on news judgement and updated on news merit.
            is_updating:
              type: boolean
              description: For events that release actual data, whether the data will be updated with new figures. This Updating flag is different from the Elementized flag. The Updating flag is set for all the Elementized events and for any additional events that are manually or otherwise updated with actual figures by Dow Jones.
            last_modified:
              type: string
              description: Date and time when the last update occurred.
            date_local:
              type: string
              description: Date and time when the event actually takes place in its location, including adjustments for daylight savings time.
            date_gmt:
              type: string
              description: The event's date and time in GMT, not considering daylight savings time.
            time_specified:
              type: boolean
            scheduled_time:
              type: string
              description: 'Optional. Either a period in which the event is likely to occur or an indication that the time is unknown. The period is relative to the event''s local time. Valid values: BMO-Before Market Opening, DMT-During Market Time, AMC-After Market Close, NA-Not Applicable. Specified only when the event''s time is not confirmed.'
            company_url:
              type: string
              description: 'Optional. URL of the company related to the event. Note: It is Null for economic events.'
            venue:
              type: string
              description: Optional. Location where the event takes place.
            country:
              type: object
              properties:
                dj_country:
                  type: string
                  description: Dow Jones Newswires country code that can be used to search and filter Dow Jones news.
                iso_country:
                  type: string
                  description: ISO country code.
                titan_country:
                  type: string
                  description: Calendar Live titan country code is the one primarily used. It is the reference country code for Dow Jones Calendar Live feed implementation via Dow Jones Newswires low latency platform.
              description: Country related to the entity that provides data or sponsorship for the event.
            regions:
              type: array
              description: Regions related to the entity that provides data or sponsorship for the event.
              items:
                type: string
            tickers:
              type: array
              description: 'Optional. Company ticker symbols. Note: Can also store general Newswires codes.'
              items:
                type: string
            isin:
              type: string
              description: Optional. Company's International Securities Identification Number (ISIN). For Treasury Auctions, it may store a Committee on Uniform Securities Identification Procedures (CUSIP) code.
            news_code:
              type: string
              description: Optional. Newswires code that can be used to link real time news from Dow Jones Newswires.
            organization_name:
              type: string
              description: Optional. Name of the entity holding the event.
            period:
              type: string
              description: Optional. Time frame covered by the data.
            description:
              type: string
              description: Defines the event.
            long_description:
              type: string
              description: Detailed definition of the event.
            dj_event_name:
              type: string
              description: Dow Jones Newswires formal name of the event. Dow Jones recommends displaying this name when available instead of the description because this name is a concise version of it.
            event_url:
              type: string
              description: Optional. URL where the source provides additional event-related information.
            event_code:
              type: string
              description: 'Event''s type code. Valid values: ICC-Corporate events, IEP-Economic and Political events, IDC-Treasury Auctions.'
            index_codes:
              type: array
              description: Optional. Dow Jones Newswires compliant news codes for related tracking indexes, such as Dow Jones Industrial Average.
              items:
                type: string
            series_code:
              type: string
              description: Optional. Defines repeatable events. For Economic events, the combination of a series code and a country code uniquely identifies a repeatable event for which Dow Jones provides numeric data.
            event_class:
              type: string
              description: Optional. Provides further details about the event type, which category the event belongs to.
            geo_location:
              type: object
              properties:
                latitude:
                  type: string
                longitude:
                  type: string
              description: Optional. Longitude and latitude where event occurs.
            social_media:
              type: array
              description: Optional. Social media URLs that provide event-related information.
              items:
                type: object
                properties:
                  type:
                    type: string
                  description:
                    type: string
                  scope:
                    type: string
                  link:
                    type: string
            influencers:
              type: array
              description: Optional. Names of persons of economic importance who may be associated with the event. Frequently, it is empty.
              items:
                type: object
                properties:
                  code:
                    type: string
                  name:
                    type: string
            details:
              type: array
              description: Optional. Additional information about the event.
              items:
                $ref: '#/components/schemas/eventDetailModel'
            ecoinfo:
              $ref: '#/components/schemas/ecoinfo'
            generic_query:
              type: string
            dj_query:
              type: string
        links:
          type: object
          properties:
            self:
              type: string
    ipoEventDataModel:
      type: object
      properties:
        type:
          type: string
        id:
          type: integer
          description: Number that uniquely identifies an event.
        attributes:
          type: object
          properties:

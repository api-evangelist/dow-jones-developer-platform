domain_standard:
  sector: Securities & market data / financial-crime compliance
  declared_in_contract: false
  note: 'Reward-only check, and the honest answer here is no. Nothing in the nine harvested contracts
    declares a market standard for its own domain: no ISO 20022 message type, no FIX/FIXML payload, no
    LEI/ISIN identifier scheme declared as such, no OpenRTB or SDMX shape. Dow Jones uses its OWN taxonomies
    as the interchange vocabulary — DJN codes, DRN resource names, Factiva news-subject and company codes,
    the Dow Jones Watchlist list-reference mapper — which is a proprietary scheme, not a published domain
    standard. ISINs and tickers appear as SEARCH VALUES inside DJN taxonomy expressions (djn:djnabout:us6703461052),
    not as a declared identifier scheme in any schema. Recorded as absent rather than stretched to fit.'
  proprietary_vocabularies:
  - Dow Jones Newswires (DJN) taxonomy codes
  - Dow Jones Resource Names (DRN)
  - Factiva news-subject, industry, region and company codes
  - Dow Jones Watchlist list reference mapper

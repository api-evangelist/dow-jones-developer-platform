  update:
    x-versioning:
      style: Accept custom media type application/vnd.dowjones.dna[.resource][.v_X.Y]+json
      response_header: X-DJ-Media-Type
      unsupported_version_status: 406
      docs: https://developer.dowjones.com/documents/site-docs-getting_started-versioning-api_versioning

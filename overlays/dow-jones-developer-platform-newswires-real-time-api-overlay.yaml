      exchange: refresh_token -> intermediate token -> jwt-bearer assertion with scope "openid pib" ->
        bearer token
      bearer_lifetime_seconds: 3600
      docs: https://developer.dowjones.com/documents/site-docs-newswires_apis-oauth-migration-guide

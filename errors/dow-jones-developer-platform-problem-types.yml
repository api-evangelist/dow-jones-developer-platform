- status: 401
  title: Unauthorized
  detail: Unauthorized access / invalid Authorization.
  remediation: Bearer tokens expire after 3600 seconds. Re-run the documented two-step exchange (refresh_token,
    then the jwt-bearer assertion with scope "openid pib") and retry; do not reuse the intermediate token.

- status: 404
  title: Not Found
  detail: No resource found for the request (article, alert, collection, third party or list).
  remediation: Confirm the DRN/ref/id exists and that the account is entitled to it — entitlement failures
    surface as 404 on content endpoints.
  apis:
  - all nine
- status: 406
  title: Not Acceptable
  detail: The requested API version is no longer supported, or Accept header negotiation failed.
  remediation: Send a supported version in the Accept custom media type, or omit it to receive the Dow
    Jones default version.
  source: https://developer.dowjones.com/documents/site-docs-getting_started-versioning-unsupported_apis

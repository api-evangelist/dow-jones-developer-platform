note: 'Dow Jones does not publish a single error reference page; this catalogue is derived from the response
  definitions the nine harvested contracts actually declare. Two envelopes coexist: a JSON:API-shaped
  errors[] array across the DNA/Factiva/Newswires contracts, and RFC 7807/9457 ProblemDetails in RiskCenter
  Third Party Platform API 0.1. No application-level error code registry is published — the code field
  exists in the envelope but its values are not enumerated.'

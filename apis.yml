  description: >-
    The Dow Jones Developer Platform is the umbrella developer surface for Dow Jones' news, business intelligence,
    market data and risk-and-compliance products. It covers three API families — Factiva, Newswires and
    Risk & Compliance — plus the file-based feed products that sit alongside them, and a shared OAuth
    2.0 identity service at accounts.dowjones.com. Individual contracts are registered as separate API
    entries in this record.

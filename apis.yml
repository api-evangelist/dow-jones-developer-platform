description: 'Dow Jones is a financial news and information provider that publishes The Wall Street Journal,
  Barron''s, MarketWatch and Financial News, and operates professional information services including
  Factiva, Dow Jones Newswires and Dow Jones Risk & Compliance. The Developer Platform is the API and
  feed surface for that content: real-time newswires search and article retrieval, Factiva news search
  and analytics, economic and IPO calendars, company and executive data, and sanctions, adverse-media
  and third-party screening. Dow Jones publishes machine-readable contracts for ten surfaces — nine OpenAPI/Swagger
  documents served from its own developer portal and a WSDL 1.1 Factiva Developer Kit with 208 SOAP operations
  — behind an OAuth 2.0 identity service requiring a two-step token exchange. Access is entitlement-based:
  no self-serve signup, no published pricing, and Newswires and Risk & Compliance applications must pass
  certification before serving users.'

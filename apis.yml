  baseURL: https://developer.factiva.com/3.16
  tags:
  - News
  - Business Data
  - SOAP
  - Search
  description: >-
    The original Factiva integration surface, in production since 2000 and still published: an XML/SOAP
    1.1 web-service suite exposing Search, Retrieval, Taxonomy, Membership, Registration, Newsstand, Track,
    CompanyProfile and MarketData. Dow Jones serves the WSDL 1.1 contract publicly at developer.factiva.com/3.16/wsdl/,
    covering 208 operations across nine SOAP ports. Version 3.x is current; SOAP v1.x and v2.x were sunset
    in July 2022 and parts of 3.x have been retired in two deprecation phases.

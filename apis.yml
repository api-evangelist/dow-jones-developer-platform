  description: 'Manage third parties, their properties and their monitored entities inside Dow Jones RiskCenter
    — the third-party risk-management product in the Risk & Compliance family. This is the only write
    surface Dow Jones publishes a contract for: it creates, updates and deletes third parties and monitored
    entities and uploads files. Two beta versions are published side by side, 0.1 (19 operations) and
    0.2 (22 operations, adding file upload/download and field-list lookups). It runs on its own host with
    its own token endpoint at auth-thirdparty.riskcenter.dowjones.com, not on api.dowjones.com.'

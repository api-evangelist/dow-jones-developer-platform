versioning:
  style: custom media type in the Accept request header
  format: application/vnd.<company>.<product>[.<resource>][.v_X.Y][+<suffix>]
  example: 'Accept: application/vnd.dowjones.dna.content.v_1.2+json'
  response_header: 'X-DJ-Media-Type: dowjones.dna; resource=<resource>; version=<X.Y>; format=json'
  wildcards: v_1.* selects the latest minor within major 1
  default_when_omitted: a Dow Jones-chosen default version that is NOT guaranteed to be the latest
  unsupported_version_status: 406
  maturity_levels:
  - level: alpha
    naming: v1alpha1
    support: may be dropped at any time without notice; zero releases of deprecation notice
  - level: beta
    naming: v2beta3
    support: supported for three months or three releases, whichever is longer
  - level: stable
    naming: vX (minor changes as v1.3)
    support: supported for 18 months or three releases, whichever is longer
  docs: https://developer.dowjones.com/documents/site-docs-getting_started-versioning-api_versioning
deprecation:
  policy_published: true
  docs: https://developer.dowjones.com/documents/site-docs-getting_started-deprecation_and_sunset_policies
  factiva_policy: https://developer.dowjones.com/documents/site-docs-getting_started-deprecation_and_sunset_policies-factiva_deprecation_policy
  rfc8594:
    implemented: true
    headers:
    - 'Deprecation: version="1.2"'
    - 'Sunset: Fri, 11 Nov 2020 23:59:59 GMT'
    - 'Link: <...>; rel="deprecation"'
    note: Dow Jones documents returning RFC 8594 Sunset plus a Deprecation version attribute and a rel="deprecation"
      Link on deprecated resource representations.
    docs: https://developer.dowjones.com/documents/site-docs-getting_started-versioning-deprecated_apis
  rules:
  - Rule 1 — a deprecated API is supported for no less than 18 months / three releases (stable), three
    months / three releases (beta), zero releases (alpha).
  - Rule 2 — an API version is not deprecated until a replacement at least as stable is released.
  - Rule 3 — a specific API must be called at least once every 90 days or Dow Jones may deprecate it.

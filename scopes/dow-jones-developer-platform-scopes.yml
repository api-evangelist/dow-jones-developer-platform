docs: https://developer.dowjones.com/documents/site-docs-getting_started-sessions_and_authentication
note: Dow Jones publishes OIDC scopes on its identity service but does NOT publish per-API authorization
  scopes. The scope string the documented token exchange sends is "openid pib" for every Dow Jones API;
  entitlement to a given product is carried by the account, not by an OAuth scope. Nothing here is a per-resource
  permission model.
issuer: https://sso.accounts.dowjones.com/
